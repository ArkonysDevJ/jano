[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Fase 1 checklist item 3 (DOCVIS-JANO-01's companion doc): the native
# side of the credential-reveal view's clipboard clear-after-copy, and
# what the Web-vs-Tauri distinction in ARCHITECTURE-01.md section 10
# ultimately resolves to on this target -- a real OS clipboard command,
# not the focus-restricted navigator.clipboard used on Web.
tauri-plugin-clipboard-manager = "2"

# Added after a real build failure here: "rustc-LLVM ERROR: out of
# memory" while compiling dependency crates (tokio, fern, ...) in
# debug mode. Full debug info (the profile.dev default) is expensive
# for LLVM to generate, on top of several rustc processes already
# running in parallel (see .cargo/config.toml's `jobs` cap, added at
# the same time). Line-tables-only keeps enough debug info for a
# useful backtrace/breakpoint file+line while using much less memory
# than full (level 2) debug info. Raise this back to `2` (or remove
# the override) on a machine with more RAM to spare.
[profile.dev]
debug = "line-tables-only"
